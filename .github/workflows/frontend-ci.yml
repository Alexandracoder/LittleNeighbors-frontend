name: Frontend CI (React + TS)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/*'
      - 'feat/*'
  pull_request:
    branches:
      - main
      - develop
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build Project
        run: npm run build

      - name: Run Tests
        run: npm test -- --run